<!doctype html>
<html lang="en">
<head>
<style>
        ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #333;
}



li a, .dropbtn {
  display: inline-block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}



li.dropdown {
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f9f9f9;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  text-align: left;
}

.dropdown-content a:hover {background-color: #f1f1f1;}

.dropdown:hover .dropdown-content {
  display: block;
}
    </style>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Pregled Nepremičnin</title>
</head>
<header>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Nepremičninski agenti</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <form class="d-flex" action="/" method="GET">
                    <button class="btn btn-outline-success">Odjava</button>
                </form>
            </div>
            <div class="d-flex ml-auto">
                % if uporabnik_id == 0:
                    <a class="btn btn-outline-primary mr-2" href="/nepremicnine">Nepremičnine</a>
                    <a class="btn btn-outline-primary mr-2" href="/agenti">Agenti</a>
                    <a class="btn btn-outline-primary mr-2" href="/klienti_boss">Klienti Boss</a>
                % elif uporabnik_id == 1:
                    <a class="btn btn-outline-primary mr-2" href="/nepremicnine">Nepremičnine</a>
                    <a class="btn btn-outline-primary mr-2" href="/klienti">Klienti</a>
                % end
            </div>
        </div>
    </nav>
</header>
<body>
    <h1>Pregled nepremičnine</h1>
    <form action="/handle-pregled-nepremicnine" method="post">
        <label for="lokacija">Izberite lokacijo:</label>
        <select id="lokacija" name="lokacija">
            % for lokacija in lokacije:
                <option value="{{ lokacija }}">{{ lokacija }}</option>
            % end
        </select><br><br>
        <button type="submit">Prikaži nepremičnine</button>
    </form>
    <!-- Display the list of properties here -->
</body>
</html>
