<!doctype html>
<html lang="en">
<head>
<style>
        ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #333;
}



li a, .dropbtn {
  display: inline-block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}



li.dropdown {
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f9f9f9;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  text-align: left;
}

.dropdown-content a:hover {background-color: #f1f1f1;}

.dropdown:hover .dropdown-content {
  display: block;
}
    </style>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Prijava</title>
</head>
<header>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Nepremičninski agenti</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <form class="d-flex" action="/" method="GET">
                    <button class="btn btn-outline-success">Odjava</button>
                </form>
                <form class="d-flex" action="/prijava" method="GET">
                    <button class="btn btn-outline-success">Prijava</button>
                </form>
            </div>
            
        </div>
    </nav>
</header>
<body>
    <h1 class="text-center" style="margin-top: 70px;">Prijava</h1>
    <div class="d-flex mt-5 justify-content-center align-items-center">
        <div class="row g-3 justify-content-center">
            <form action="/prijava" method="POST">
                <div class="row mb-4">
                    <label for="colFormLabel" class="col-sm-4 col-form-label">Kontakt:</label>
                    <div class="col-sm-8 d-flex align-items-center">
                        <input type="text" class="form-control me-2" id="colFormLabel" placeholder="Kontakt " name="uporabnisko_ime">
                    </div>
                    <label for="colFormLabel" class="col-sm-4 col-form-label">Vpiši geslo:</label>
                    <div class="col-sm-8 d-flex align-items-center">
                        <input type="password" class="form-control me-2" id="colFormLabel" placeholder="Geslo" name="geslo">
                    </div>
                    <div class="col-sm-12 d-flex justify-content-center mt-3">
                        <button type="submit" class="btn btn-outline-success btn-lg">Prijava</button>
                    </div>
                </div>
            </form>
        </div>
        {{napaka}}
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
